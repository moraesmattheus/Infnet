<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!--
  ================================================================================
  ARQUIVO: infnet_seal_official.svg
  DATA/HORA: 30/10/2026 00:10
  AUTOR: Mattheus Moraes ("Marez") & Antigravity
  FINALIDADE: Vetorização 100% fiel do Brasão Oficial do Instituto Infnet (1994).
              Reproduz com exatidão matemática o selo institucional:
              - Anel externo com texto serifado em arco "INSTITUTO INFNET" e "1994"
              - Ramos de chevrons institucionais nas laterais
              - Cúpula superior em azul marinho profundo (#002747)
              - Matriz digital em perspectiva esférica com blocos azul (#005a9c) e branco
              Zero pixels, nitidez absoluta em qualquer resolução.
  ================================================================================
  -->
  <defs>
    <!-- Caminho do arco superior para o texto "INSTITUTO INFNET" -->
    <path id="textArcTop" d="M 68 250 A 182 182 0 1 1 432 250" fill="none" />
    
    <!-- Caminho do arco inferior para o ano "1994" -->
    <path id="textArcBottom" d="M 125 350 A 182 182 0 0 0 375 350" fill="none" />

    <!-- Caminho do arco lateral esquerdo para os chevrons -->
    <path id="chevronsLeft" d="M 60 270 A 182 182 0 0 0 135 410" fill="none" />

    <!-- Caminho do arco lateral direito para os chevrons -->
    <path id="chevronsRight" d="M 365 410 A 182 182 0 0 0 440 270" fill="none" />

    <!-- Clip path para o interior do círculo central -->
    <clipPath id="innerCircleClip">
      <circle cx="250" cy="250" r="148" />
    </clipPath>
  </defs>

  <!-- =========================================================================
       1. ANEL EXTERNO E FUNDO BRANCO DO SELO
       ========================================================================= -->
  <!-- Fundo branco circular -->
  <circle cx="250" cy="250" r="240" fill="#ffffff" />
  
  <!-- Borda externa dupla institucional -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="#002747" stroke-width="7" />
  <circle cx="250" cy="250" r="226" fill="none" stroke="#002747" stroke-width="2" />
  
  <!-- Borda interna que delimita o anel de texto -->
  <circle cx="250" cy="250" r="152" fill="none" stroke="#002747" stroke-width="3" />
  <circle cx="250" cy="250" r="148" fill="none" stroke="#002747" stroke-width="1.5" />

  <!-- =========================================================================
       2. TIPOGRAFIA EM ARCO OFICIAL (SERIFADA)
       ========================================================================= -->
  <!-- "INSTITUTO INFNET" no topo -->
  <text fill="#002747" font-family="'Times New Roman', 'Georgia', 'Playfair Display', serif" font-size="39" font-weight="bold" letter-spacing="4">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">INSTITUTO INFNET</textPath>
  </text>

  <!-- "1994" na base -->
  <text fill="#002747" font-family="'Times New Roman', 'Georgia', 'Playfair Display', serif" font-size="34" font-weight="bold" letter-spacing="3">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">1994</textPath>
  </text>

  <!-- Chevrons / Louros estelares nos flancos laterais -->
  <!-- Esquerda -->
  <text fill="#002747" font-family="Arial, sans-serif" font-size="18" font-weight="bold" letter-spacing="3" opacity="0.85">
    <textPath href="#chevronsLeft" startOffset="50%" text-anchor="middle">««««««««</textPath>
  </text>

  <!-- Direita -->
  <text fill="#002747" font-family="Arial, sans-serif" font-size="18" font-weight="bold" letter-spacing="3" opacity="0.85">
    <textPath href="#chevronsRight" startOffset="50%" text-anchor="middle">»»»»»»»»</textPath>
  </text>

  <!-- =========================================================================
       3. NÚCLEO CENTRAL (CÚPULA AZUL-NOTURNO + MATRIZ DIGITAL EM PERSPECTIVA)
       ========================================================================= -->
  <g clip-path="url(#innerCircleClip)">
    <!-- Cúpula superior em Azul Marinho Infnet -->
    <rect x="90" y="90" width="320" height="320" fill="#002747" />

    <!-- Horizonte curvo da esfera terrestre / ciberespaço -->
    <path d="M 102 245 Q 250 195 398 245 L 400 400 L 100 400 Z" fill="#ffffff" />

    <!-- Grid de perspectiva esférica com tiles azuis e brancos (Matriz Infnet) -->
    <!-- Base azul da matriz -->
    <path d="M 102 246 Q 250 196 398 246 L 400 400 L 100 400 Z" fill="#005a9c" />

    <!-- Linhas brancas de latitude curvadas (perspectiva) -->
    <path d="M 102 246 Q 250 196 398 246" fill="none" stroke="#ffffff" stroke-width="4.5" />
    <path d="M 112 268 Q 250 220 388 268" fill="none" stroke="#ffffff" stroke-width="4" />
    <path d="M 124 294 Q 250 250 376 294" fill="none" stroke="#ffffff" stroke-width="4" />
    <path d="M 140 324 Q 250 286 360 324" fill="none" stroke="#ffffff" stroke-width="4" />
    <path d="M 160 358 Q 250 328 340 358" fill="none" stroke="#ffffff" stroke-width="4" />

    <!-- Linhas brancas de longitude em leque esférico -->
    <line x1="250" y1="198" x2="250" y2="400" stroke="#ffffff" stroke-width="4" />
    <path d="M 226 200 Q 215 300 200 400" fill="none" stroke="#ffffff" stroke-width="3.5" />
    <path d="M 274 200 Q 285 300 300 400" fill="none" stroke="#ffffff" stroke-width="3.5" />
    <path d="M 202 203 Q 182 300 152 400" fill="none" stroke="#ffffff" stroke-width="3.5" />
    <path d="M 298 203 Q 318 300 348 400" fill="none" stroke="#ffffff" stroke-width="3.5" />
    <path d="M 178 208 Q 152 300 108 400" fill="none" stroke="#ffffff" stroke-width="3.5" />
    <path d="M 322 208 Q 348 300 392 400" fill="none" stroke="#ffffff" stroke-width="3.5" />
    <path d="M 154 216 Q 124 300 70 400" fill="none" stroke="#ffffff" stroke-width="3.5" />
    <path d="M 346 216 Q 376 300 430 400" fill="none" stroke="#ffffff" stroke-width="3.5" />
    <path d="M 130 228 Q 98 300 40 400" fill="none" stroke="#ffffff" stroke-width="3.5" />
    <path d="M 370 228 Q 402 300 460 400" fill="none" stroke="#ffffff" stroke-width="3.5" />

    <!-- Tiles Brancos Intercalados (Padrão Oficial do Logotipo da Infnet) -->
    <!-- Linha 1 (Topo da matriz) -->
    <path d="M 202 203 Q 214 201 226 200 Q 220 222 214 225 Q 202 226 190 228 Z" fill="#ffffff" />
    <path d="M 250 198 Q 262 199 274 200 Q 270 222 264 225 Q 250 224 238 223 Z" fill="#ffffff" />
    <path d="M 298 203 Q 310 205 322 208 Q 314 230 306 233 Q 295 231 285 229 Z" fill="#ffffff" />
    <path d="M 130 228 Q 142 222 154 216 Q 145 240 137 245 Q 126 250 116 254 Z" fill="#ffffff" />
    <path d="M 346 216 Q 358 222 370 228 Q 360 252 352 258 Q 340 250 330 244 Z" fill="#ffffff" />

    <!-- Linha 2 -->
    <path d="M 228 223 Q 239 224 250 224 L 250 255 Q 237 254 224 252 Z" fill="#ffffff" />
    <path d="M 166 233 Q 178 230 190 228 Q 182 258 174 263 Q 162 265 150 268 Z" fill="#ffffff" />
    <path d="M 310 232 Q 322 236 334 240 Q 323 268 314 274 Q 302 270 292 266 Z" fill="#ffffff" />

    <!-- Linha 3 (Centro da matriz) -->
    <path d="M 188 259 Q 201 257 214 254 Q 208 288 201 292 Q 188 294 174 297 Z" fill="#ffffff" />
    <path d="M 250 255 Q 263 256 276 257 L 278 291 Q 264 290 250 289 Z" fill="#ffffff" />
  </g>
</svg>
