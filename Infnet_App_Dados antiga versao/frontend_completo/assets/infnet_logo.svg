<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 84" width="100%" height="100%">
  <!--
  ================================================================================
  ARQUIVO: infnet_logo.svg
  DATA/HORA: 29/10/2026 23:50
  AUTOR: Mattheus Moraes ("Marez") & Antigravity
  FINALIDADE: Logotipo vetorial oficial em altíssima definição (SVG) do Instituto Infnet.
              Desenvolvido do zero em curvas vetoriais puras (zero pixelização),
              com brasão institucional com louros, globo com coordenadas de rede,
              ano de fundação (1994), tipografia geométrica precisa com tracking nobre
              e nó tecnológico ciano com iluminação especular.
  ================================================================================
  -->
  <defs>
    <!-- Gradientes de profundidade 3D para o brasão e o globo -->
    <linearGradient id="infnetGlobeDepth" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#006cd1" />
      <stop offset="45%" stop-color="#004b87" />
      <stop offset="100%" stop-color="#002244" />
    </linearGradient>

    <linearGradient id="infnetCyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0099ff" />
    </linearGradient>

    <filter id="vectorDropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#004b87" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- =========================================================================
       BRASÃO VETORIAL DO INSTITUTO INFNET (GLOBO + LOUROS + COORDENADAS)
       ========================================================================= -->
  <g transform="translate(10, 6)" filter="url(#vectorDropGlow)">
    
    <!-- Anel externo do brasão com acabamento fino -->
    <circle cx="36" cy="36" r="34" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.2" class="infnet-crest-outer" />
    <circle cx="36" cy="36" r="31" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.1" stroke-dasharray="2 3" class="infnet-crest-dashed" />

    <!-- Ramos de Louro Institucionais (Símbolo de Excelência Acadêmica) -->
    <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity="0.65" class="infnet-laurels">
      <!-- Ramo Esquerdo -->
      <path d="M 12 36 C 12 52 24 64 36 66" />
      <path d="M 14 44 C 11 43 9 40 10 38" />
      <path d="M 18 51 C 14 51 12 48 13 46" />
      <path d="M 24 58 C 20 59 18 56 19 54" />
      <path d="M 31 63 C 27 65 25 63 26 61" />

      <!-- Ramo Direito -->
      <path d="M 60 36 C 60 52 48 64 36 66" />
      <path d="M 58 44 C 61 43 63 40 62 38" />
      <path d="M 54 51 C 58 51 60 48 59 46" />
      <path d="M 48 58 C 52 59 54 56 53 54" />
      <path d="M 41 63 C 45 65 47 63 46 61" />
    </g>

    <!-- Globo Central (Preenchimento Nobre 3D) -->
    <circle cx="36" cy="34" r="23" fill="url(#infnetGlobeDepth)" />
    
    <!-- Brilho de Reflexo Superior no Globo -->
    <ellipse cx="36" cy="18" rx="14" ry="5" fill="#ffffff" opacity="0.22" />

    <!-- Linhas de Rede / Latitude e Longitude (Precisão Tecnológica) -->
    <g fill="none" stroke="#ffffff" stroke-width="1.25" stroke-linecap="round" opacity="0.92">
      <!-- Meridianos (Longitude) -->
      <ellipse cx="36" cy="34" rx="15" ry="23" />
      <ellipse cx="36" cy="34" rx="7" ry="23" />
      <line x1="36" y1="11" x2="36" y2="57" stroke-width="1.4" />

      <!-- Paralelos (Latitude) -->
      <line x1="13" y1="34" x2="59" y2="34" stroke-width="1.5" />
      <path d="M 16 23 C 24 28 48 28 56 23" />
      <path d="M 16 45 C 24 40 48 40 56 45" />
    </g>

    <!-- Ano de Fundação 1994 em Monospace Nobre -->
    <text x="36" y="69" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="800" fill="currentColor" text-anchor="middle" letter-spacing="2" class="infnet-year-text">1994</text>
  </g>

  <!-- =========================================================================
       TIPOGRAFIA OFICIAL: "INSTITUTO INFNET" COM PROPORÇÕES DE GRIFE TECH
       ========================================================================= -->
  <g transform="translate(94, 38)">
    <!-- Subtítulo "INSTITUTO" com kerning aberto de alta sofisticação -->
    <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="11" font-weight="700" fill="currentColor" opacity="0.65" letter-spacing="4.5" text-transform="uppercase" class="infnet-wordmark-sub">INSTITUTO</text>
    
    <!-- Marca Principal "INFNET" Bold Geométrico com Kerning Perfeito -->
    <text x="0" y="27" font-family="'Plus Jakarta Sans', 'SF Pro Display', -apple-system, sans-serif" font-size="28" font-weight="800" fill="currentColor" letter-spacing="-0.8" class="infnet-wordmark-main">INFNET</text>
    
    <!-- Ponto Tecnológico de Inovação em Gradiente Ciano com Halo -->
    <circle cx="127" cy="20" r="4" fill="url(#infnetCyanGlow)" />
    <circle cx="127" cy="20" r="6" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4" />
  </g>
</svg>
